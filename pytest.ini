[pytest]
# Configuración de pytest para Reciclapp

# Directorio donde se encuentran los tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py *_test.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones adicionales para pytest
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

# Marcadores personalizados
markers =
    unit: Tests unitarios para funciones y métodos individuales
    integration: Tests de integración entre componentes
    ui: Tests de interfaz de usuario
    slow: Tests que tardan más tiempo en ejecutarse
    skip_ci: Tests que se saltean en CI/CD

# Timeout por defecto para los tests (en segundos)
timeout = 10

# Configuración de cobertura
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

